[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "habito"
version = "1.0.0"
description = "A simple habit tracker with a rich TUI, JSON persistence and functional analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pylint>=4.0",
]

[project.scripts]
habito = "habito:main"

[tool.setuptools]
packages = ["habito", "clients", "models", "repository", "services", "utils"]
py-modules = ["config"]